[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meal-plan-generator"
version = "0.4.2"
description = "Desktop AI meal plan generator: pantry + health profile -> a week of meals."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-meal-plan-generator contributors" }]
keywords = ["meal-plan", "nutrition", "ai", "desktop", "planner"]

dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "tomli>=2.0; python_version < '3.11'",
    "platformdirs>=4.2,<5",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
mealplan = "src.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"